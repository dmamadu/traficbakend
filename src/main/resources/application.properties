# Configuration locale de développement : copier dans un fichier .env local
# et ne jamais committer les vraies valeurs de credentials dans ce fichier.



spring.application.name=gestionProjet

# Database
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
server.port=${SERVER_PORT:8081}

springdoc.swagger-ui.use-root-path=true

# Jackson — dates sérialisées en ISO 8601 (ex: "2024-01-15") au lieu de timestamps numériques
spring.jackson.serialization.write-dates-as-timestamps=false

# Email
spring.mail.default-encoding=UTF-8
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# MinIO
minio.endpoint=${MINIO_ENDPOINT}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket-name=${MINIO_BUCKET_NAME}

# AWS
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
cloud.aws.region.static=${AWS_REGION}
cloud.aws.s3.bucket=${AWS_BUCKET}

# JWT
app.jwt.secret=${JWT_SECRET}

# App
app.support.mail=${APP_SUPPORT_MAIL}
app.front.url=${APP_FRONT_URL}
app.version=1.0.0