# Construit l'image du backend et la publie sur ghcr.io. Ne déploie rien (voir deploy.yml).
#   push sur main  -> tags  sha-<7 car.>  et  latest
#   tag Git v1.4.0 -> tags  1.4.0  et  1.4
name: Build backend

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/invodis-backend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construction et publication
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Résumé
        run: |
          {
            echo "### Image backend publiée"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Pour déployer : Actions → **Deploy backend** → Run workflow → version \`sha-${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
