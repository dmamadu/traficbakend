version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: invodis-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gestionProjet
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${DATASOURCE_USERNAME}
      MYSQL_PASSWORD: ${DATASOURCE_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - invodis-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build: .
    container_name: invodis-backend
    restart: unless-stopped
    ports:
      - "8080:8081"
    environment:
      SERVER_PORT: 8081
      DATASOURCE_URL: jdbc:mysql://mysql:3306/gestionProjet?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DATASOURCE_USERNAME: ${DATASOURCE_USERNAME}
      DATASOURCE_PASSWORD: ${DATASOURCE_PASSWORD}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY:-placeholder}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY:-placeholder}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_BUCKET: ${AWS_BUCKET:-placeholder}
      JWT_SECRET: ${JWT_SECRET}
      APP_SUPPORT_MAIL: ${APP_SUPPORT_MAIL}
      APP_FRONT_URL: ${APP_FRONT_URL}
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - invodis-network

  minio:
    image: minio/minio
    container_name: invodis-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - invodis-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  mysql_data:
  minio_data:

networks:
  invodis-network:
    driver: bridge
